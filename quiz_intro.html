<!DOCTYPE html>
<head>
<meta name="viewport" content="width=960, initial-scale=1">

<title>Understanding Check</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#120816;
  --text:#ffe9f4;
  --pink:#ff4fb3;
  --pink2:#ff86c9;
  --shadow:rgba(0,0,0,0.35);
}

*{ box-sizing:border-box; }

html, body{
  width:960px;
  height:540px;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  font-family:"Press Start 2P", sans-serif;
  color:var(--text);
}

#stage{
  position:absolute;
  top:0;
  left:0;
  width:960px;
  height:540px;
  background: linear-gradient(#1b0a22, #050108);
  padding:44px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:760px;
  border:4px solid var(--text);
  background: rgba(0,0,0,0.35);
  box-shadow:0 14px 0 var(--shadow);
  padding:36px;
  text-align:center;
}

h1{
  margin:0 0 18px 0;
  font-size:22px;
  color:var(--pink);
}

p{
  margin:0 0 26px 0;
  font-size:11px;
  line-height:1.9;
  color:var(--pink2);
}

.btn{
  display:inline-block;
  padding:16px 20px;
  border:4px solid var(--text);
  color:var(--text);
  text-decoration:none;
  font-size:11px;
  box-shadow:0 10px 0 var(--shadow);
}

.btn:active{
  transform: translateY(4px);
  box-shadow:0 6px 0 var(--shadow);
}

.small{
  margin-top:18px;
  font-size:8px;
  color:rgba(255,233,244,0.6);
  line-height:1.7;
}
</style>
</head>

<body>

<div id="stage">
  <div class="card">

    <h1>UNDERSTANDING CHECK</h1>

    <p>
      3 QUICK QUESTIONS<br>
      TAP THE BEST ANSWER TO CONTINUE
    </p>

    <a class="btn" href="quiz1.html">START</a>

    <div class="small">
      your choices will be recorded
    </div>

  </div>
</div>

<script>
localStorage.setItem("quizScore", "0");
localStorage.setItem("quizTotal", "3");
</script>

</body>
</html>
